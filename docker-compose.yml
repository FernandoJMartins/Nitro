services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: videos_em_massa
    volumes:
      - pgdata:/var/lib/postgresql/data
    # expõe o Postgres do container na porta 5433 do seu Windows (pgAdmin/DBeaver).
    # Usa 5433 para não conflitar com um Postgres local na 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d videos_em_massa"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/videos_em_massa
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: http://localhost:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-troque-em-producao}
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    # opcional: expõe a API direto (Swagger em http://localhost:8000/docs)
    ports:
      - "8000:8000"

# Obs.: não há mais serviço "frontend" aqui. O front roda em modo dev (Vite, :5173)
# via docker-compose.dev.yml. A porta 8080 foi removida para não servir um build
# estático desatualizado.

volumes:
  pgdata:
  storage:
