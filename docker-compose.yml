# Este compose usa SEMPRE o mesmo banco dos demais: o seu Postgres local,
# definido em LOCAL_DATABASE_URL no .env (host.docker.internal:5432).
# Assim não existe mais um Postgres "separado" em container que ficava vazio.
#
# Pré-requisito (uma vez): o banco precisa existir no seu Postgres local:
#   psql -U postgres -c "CREATE DATABASE videos_em_massa;"

services:
  backend:
    build: ./backend
    # volta a subir sozinho no boot do servidor / se crashar (mas fica parado se
    # você parar de propósito com `docker compose stop`).
    restart: unless-stopped
    environment:
      # Único banco, o do .env — igual ao dev.yml e ao local-db.yml.
      DATABASE_URL: ${LOCAL_DATABASE_URL}
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: http://localhost:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-troque-em-producao}
    volumes:
      - storage:/app/storage
      # fontes locais (ex.: emoji da Apple) — largue o .ttf/.ttc/.otf em ./fonts
      # e ele aparece dentro do container. Sobrevive a rebuild; não some com o volume.
      - ./fonts:/app/storage/fonts
    # permite o container enxergar o Postgres da máquina host (Docker Desktop e Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # opcional: expõe a API direto (Swagger em http://localhost:8000/docs)
    ports:
      - "8000:8000"

# Obs.: não há mais serviço "frontend" aqui. O front roda em modo dev (Vite, :5173)
# via docker-compose.dev.yml. A porta 8080 foi removida para não servir um build
# estático desatualizado.

volumes:
  storage:
